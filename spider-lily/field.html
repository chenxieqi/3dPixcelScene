<html lang="ja"><head><meta charset="utf-8"><title>Lycoris Field</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#1f2622;overflow:hidden;font:12px sans-serif;color:#cfd6cf}
  /* canvas lives in #stage; controls are a side panel next to it, so they never cover the image */
  body{display:flex;flex-direction:row}
  #stage{flex:1;min-width:0;min-height:0;position:relative;container-type:size;display:flex;align-items:center;justify-content:center}
  canvas{width:min(100cqw,100cqh);height:min(100cqw,100cqh);image-rendering:pixelated;display:block}
  #ui{width:270px;flex:none;height:100%;box-sizing:border-box;overflow-y:auto;background:#161b19;border-left:1px solid #2f3833;padding:8px 10px 16px;display:flex;flex-direction:column;gap:5px}
  body.ui-hidden #ui{display:none}
  #ui h4{margin:10px 0 2px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#8fa398;border-bottom:1px solid #2f3833;padding-bottom:3px}
  #ui h4:first-child{margin-top:0}
  #ui label{display:flex;align-items:center;gap:6px;justify-content:space-between;min-height:22px}
  #ui label:has(input[type=checkbox]){justify-content:flex-start}
  #ui input[type=range]{width:120px;flex:none}
  #ui .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #ui .hint,#ui .seed{opacity:.65;font-size:11px}
  #uitoggle{position:absolute;top:8px;right:8px;z-index:5;opacity:.7}
  #uitoggle:hover{opacity:1}
  @media (max-width: 760px){
    body{flex-direction:column}
    #ui{width:auto;height:42vh;border-left:none;border-top:1px solid #2f3833}
  }
  #dlg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:10}
  #dlg[hidden]{display:none}
  #dlg .box{background:#20262a;border:1px solid #4a554d;border-radius:6px;padding:12px;width:min(560px,92vw);display:flex;flex-direction:column;gap:8px}
  #dlg textarea{height:160px;background:#151a1c;color:#dde;border:1px solid #4a554d;font:12px monospace;padding:6px;resize:vertical}
  #dlg .row{display:flex;gap:6px;align-items:center;justify-content:flex-end}
  #dlg #dlgmsg{flex:1;color:#e9a;font-size:12px}
  button,select{background:#2c332e;color:#dde;border:1px solid #4a554d;padding:3px 8px;cursor:pointer}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="dlg" hidden>
  <div class="box">
    <div id="dlgtitle">設定を読み込む</div>
    <textarea id="dlgtext" spellcheck="false" placeholder="コピーした設定をここに貼り付け"></textarea>
    <div class="row"><span id="dlgmsg"></span><button id="dlgok">適用</button><button id="dlgcancel">閉じる</button></div>
  </div>
</div>
<div id="stage"><button id="uitoggle" title="コントロールパネルの表示/非表示">⚙ パネル</button></div>
<div id="ui">
  <h4>画面</h4>
  <label>ピクセル <select id="pix"><option>1</option><option selected>2</option><option>3</option></select></label>
  <label>ズーム <span class="row"><input type="range" id="zoom" min="0.9" max="1.8" step="0.05" value="1.65"><span id="zoomv">1.65</span></span></label>
  <label><input type="checkbox" id="dither" checked> ディザ</label>
  <label><input type="checkbox" id="outline"> 輪郭線</label>
  <label><input type="checkbox" id="palette"> 花のパレット</label>

  <h4>花</h4>
  <label>花の群れ <span class="row"><input type="range" id="clumps" min="2" max="24" step="1" value="23"><span id="clumpsv">23</span></span></label>
  <div class="row"><button id="reroll">🎲 花の群れをランダムに</button><span id="seedv" class="seed">seed 2473437358</span></div>
  <label><input type="checkbox" id="hero" checked> 赤い点</label>
  <label><input type="checkbox" id="fg" checked> 手前の花</label>
  <label>手前の花の大きさ <input type="range" id="fgs" min="0.6" max="3" step="0.05" value="1.45"></label>
  <div class="row"><button id="fgroll">🎲 手前の花をランダムに</button><span id="fgseedv" class="seed">fg 31337</span></div>
  <label><input type="checkbox" id="clip" checked> 下端を切り取る</label>

  <h4>光</h4>
  <label>時間帯 <select id="tod">
    <option value="dawn">早朝</option><option value="morning">午前</option><option value="noon">正午</option>
    <option value="golden" selected>午後の金色の光（既定）</option><option value="dusk">夕暮れ</option><option value="night">夜（月明かり）</option></select></label>
  <label>影の割合 <input type="range" id="shadef" min="0" max="0.7" step="0.05" value="0.25"></label>
  <label>影の明るさ <input type="range" data-lit="uLiftK" min="0" max="2" step="0.1" value="1.3"></label>
  <label>日なたの花の明るさ <input type="range" data-lit="uFlowerLit" min="1" max="4" step="0.1" value="1.5"></label>
  <label>明暗の境目 <input type="range" data-lit="uEdge" min="0" max="1" step="0.05" value="0.8"></label>

  <h4>空気</h4>
  <label>遠景の霧 <input type="range" data-fog="uFar" min="0" max="1" step="0.05" value="0.65"></label>
  <label>霧の始まり <input type="range" data-fog="uFarStart" min="-0.8" max="1.0" step="0.05" value="-0.2"></label>
  <label>地表のもや <input type="range" data-fog="uMist" min="0" max="1" step="0.05" value="0"></label>
  <label>もやの高さ <input type="range" data-fog="uMistH" min="0.04" max="0.5" step="0.02" value="0.2"></label>
  <label>手前を暗く <input type="range" data-fog="uFront" min="0" max="0.8" step="0.05" value="0.65"></label>

  <h4>被写界深度</h4>
  <label><input type="checkbox" id="dof" checked> 被写界深度 <span class="hint">（画面クリックでピント合わせ）</span></label>
  <label>ぼかし <input type="range" id="dofs" min="1" max="8" step="0.5" value="3"></label>
  <label>ピントの範囲 <input type="range" id="dofr" min="0" max="0.8" step="0.05" value="0.45"></label>

  <h4>設定</h4>
  <div class="row"><select id="slot" data-nosave></select><button id="slotsave">💾 保存</button><button id="slotload">📂 読み込み</button></div>
  <div class="row"><button id="copyset">📋 コピー</button><button id="importset">📥 読み込み</button></div>

  <h4>出力</h4>
  <div class="row"><button id="rec">● 録画 5秒</button><span id="st"></span></div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ================= config ================= */
const OUT = 960;                       // output canvas px (recorded video size)
const BG = new THREE.Color('#1f2622');  // flat background
const FOG = new THREE.Color('#5a6b66'); // aerial-perspective haze (lighter, cooler)
const R = 1.3;                          // island radius (m)
const WIND = new THREE.Vector3(0.93, 0, 0.36).normalize(); // blows toward screen right/down

/* ================= noise / rng ================= */
const hash = (x, y) => { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2; a *= 0.5; } return s / 0.9375; };
let seed = 20261121; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

/* ================= field functions =================
   Camera looks from +X+Y+Z, so screen bottom-right = +X, top-left = -X.  */
// edge roughness: bottom-right (+X) breaks up into notches, crumbs and stray clods like a torn edge
const roughW = (x, z) => smooth(0.05, 0.6, x / R + 0.15 * z / R);
const mask = (x, z) => {
  const base = 1 - Math.hypot(x, z) / R + (fbm(x * 1.8 + 5, z * 1.8 + 5) - 0.5) * 0.6;
  const w = roughW(x, z);
  if (w <= 0) return base;
  return base + w * ((fbm(x * 6 + 1, z * 6 + 3) - 0.5) * 0.42 + (vnoise(x * 18 + 7, z * 18 + 2) - 0.5) * 0.22);
};
const heightAt = (x, z) => -0.22 * x + 0.08 * (fbm(x * 1.3 + 2, z * 1.3) - 0.5);
const dirtAt = (x, z) => smooth(0.3, 0.62, x / R + 0.25 * z / R + (fbm(x * 2.6 + 9, z * 2.6) - 0.5) * 0.55);
const centerW = (x, z) => Math.exp(-(x * x + z * z) / (2 * 0.5 * 0.5));

/* ================= renderer / scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1); renderer.setSize(OUT, OUT, false);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);
// panel toggle (remembered per browser)
{ const KEY = 'pixel-diorama-ui-hidden';
  try { if (localStorage.getItem(KEY) === '1') document.body.classList.add('ui-hidden'); } catch {}
  document.getElementById('uitoggle').onclick = () => {
    const h = document.body.classList.toggle('ui-hidden');
    try { localStorage.setItem(KEY, h ? '1' : '0'); } catch {}
  }; }

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(FOG, 9.85, 11.7);

/* ================= layered fog =================
   foreground darkened -> midground clear -> background hazy,
   plus a low ground mist that hides grass roots so blades separate in depth. */
const fogU = {
  uFar: { value: 0.65 },                               // background haze strength
  uMist: { value: 0.0 },                              // ground mist strength
  uMistH: { value: 0.2 },                             // ground mist height (m)
  uMistColor: { value: new THREE.Color('#4d5d58') },
  uFront: { value: 0.65 },                              // foreground darkening
  uFrontAt: { value: -0.2 },                           // where foreground darkening ends (scene depth, m)
  uFarStart: { value: -0.2 },                           // where background haze starts (0 = center)
  uFarEnd: { value: 1.2 },                             // where haze is full
  uFwd: { value: new THREE.Vector2(-1, -1).normalize() }, // camera forward on the ground plane
};
function patchFog(sh) {
  Object.assign(sh.uniforms, fogU);
  sh.vertexShader = sh.vertexShader
    .replace('#include <fog_pars_vertex>', '#include <fog_pars_vertex>\nvarying vec3 vWPos;')
    .replace('#include <fog_vertex>', '#include <fog_vertex>\nvWPos = (inverse(viewMatrix) * mvPosition).xyz;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <fog_pars_fragment>', `#include <fog_pars_fragment>
      varying vec3 vWPos;
      uniform float uFar, uMist, uMistH, uFront, uFrontAt, uFarStart, uFarEnd; uniform vec3 uMistColor; uniform vec2 uFwd;`)
    .replace('#include <fog_fragment>', `
      #ifdef USE_FOG
      {
        // scene depth = how far back along the ground, independent of height,
        // so a tall flower gets the same haze as the ground it stands on
        float sd = dot(vWPos.xz, uFwd);
        float dF = smoothstep(uFarStart, uFarEnd, sd);
        float hgt = vWPos.y - (-0.22 * vWPos.x);
        float mist = (1.0 - smoothstep(0.0, uMistH, hgt)) * uMist * (0.15 + 0.85 * dF);
        float front = (1.0 - smoothstep(uFrontAt - 1.1, uFrontAt, sd)) * uFront;
        gl_FragColor.rgb = mix(gl_FragColor.rgb, uMistColor, mist);
        gl_FragColor.rgb *= 1.0 - front;
        gl_FragColor.rgb = mix(gl_FragColor.rgb, fogColor, dF * uFar);
      }
      #endif`);
  patchLight(sh);
}
/* ================= shadow look =================
   shadows keep a green-yellow canopy light, objects bounce their own hue
   (green grass, red petals, yellow straw) into the shade, and the light/shadow
   boundary gets a darker band. */
const litU = {
  uShadowLift: { value: new THREE.Vector3(0.15, 0.17, 0.12) }, // fraction of sun left in shade (canopy-filtered)
  uLiftK: { value: 1.3 },
  uFlowerLit: { value: 1.5 },
  uFlowerWarm: { value: 1.0 },                                 // how much the boost shifts toward orange (0 at night)                                  // extra sunlight on flower heads (1 = none)
  uEdge: { value: 0.8 },
};
const SHADOW_LINE = 'directLight.color *= ( directLight.visible && receiveShadow ) ? getShadow( directionalShadowMap[ i ], directionalLightShadow.shadowMapSize, directionalLightShadow.shadowBias, directionalLightShadow.shadowRadius, vDirectionalShadowCoord[ i ] ) : 1.0;';
const LIGHTS_BEGIN = THREE.ShaderChunk.lights_fragment_begin.replace(SHADOW_LINE, `
    { float sh = ( directLight.visible && receiveShadow ) ? getShadow( directionalShadowMap[ i ], directionalLightShadow.shadowMapSize, directionalLightShadow.shadowBias, directionalLightShadow.shadowRadius, vDirectionalShadowCoord[ i ] ) : 1.0;
      gSun = directLight.color; gShadow = min(gShadow, sh);
      directLight.color *= mix(uShadowLift * uLiftK, vec3(1.0), sh); }`);
if (!THREE.ShaderChunk.lights_fragment_begin.includes(SHADOW_LINE)) console.warn('shadow chunk changed; shadow look disabled');
function patchLight(sh) {
  if (!sh.fragmentShader.includes('#include <lights_fragment_begin>')) return;
  Object.assign(sh.uniforms, litU);
  sh.fragmentShader = sh.fragmentShader
    .replace('void main() {', 'uniform vec3 uShadowLift; uniform float uLiftK, uEdge, uFlowerLit, uFlowerWarm;\nvoid main() {\n  float gShadow = 1.0; vec3 gSun = vec3(0.0);')
    .replace('#include <lights_fragment_begin>', LIGHTS_BEGIN)
    .replace('#include <aomap_fragment>', `
      {
        #ifdef IS_FLOWER
        // only the sunlit part is boosted, warming toward orange as it gets brighter
        reflectedLight.directDiffuse *= uFlowerLit * vec3(1.0, 1.0 + 0.35 * uFlowerWarm * (uFlowerLit - 1.0), 1.0 + 0.1 * uFlowerWarm * (uFlowerLit - 1.0));
        #endif
        float dk = 1.0 - uEdge * 4.0 * gShadow * (1.0 - gShadow);
        reflectedLight.directDiffuse *= dk; reflectedLight.indirectDiffuse *= dk;
      }
      #include <aomap_fragment>`);
}


const H = 1.65;
const cam = new THREE.OrthographicCamera(-H, H, H, -H, 0.1, 30);
const target = new THREE.Vector3(0, 0.12, 0);
cam.position.copy(target).add(new THREE.Vector3(1, 1.15, 1).normalize().multiplyScalar(10));
cam.lookAt(target);

const hemi = new THREE.HemisphereLight(0x7f94a8, 0x2c2a1a, 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffc488, 4.2);
const SUN_DIST = 20;
sun.position.set(-4.2, 2.8, 1.6).normalize().multiplyScalar(SUN_DIST);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 4;
Object.assign(sun.shadow.camera, { left: -3.2, right: 3.2, top: 3.2, bottom: -3.2, near: 1, far: 45 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.01;
scene.add(sun, sun.target);

const timeU = { value: 0 };
let terrainMesh, grassMesh, grassMaskMat, grassGeo, grassMat;

/* ================= terrain ================= */
{
  const N = 160, S = 1.7, pos = [], col = [];
  const cGround = new THREE.Color('#2a311f'), cGround2 = new THREE.Color('#3a3f24');
  const cDirt = new THREE.Color('#5b4631'), cDirt2 = new THREE.Color('#7a6342');
  const P = (i, j) => { const x = -S + 2 * S * i / N, z = -S + 2 * S * j / N; return [x, heightAt(x, z), z]; };
  const c = new THREE.Color(), c2 = new THREE.Color();
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const a = P(i, j), b = P(i + 1, j), cc = P(i + 1, j + 1), d = P(i, j + 1);
    for (const tri of [[a, cc, b], [a, d, cc]]) {
      const cx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3, cz = (tri[0][2] + tri[1][2] + tri[2][2]) / 3;
      const m = mask(cx, cz); if (m <= 0) continue;
      const n = fbm(cx * 6, cz * 6);
      c.copy(cGround).lerp(cGround2, n);
      c2.copy(cDirt).lerp(cDirt2, smooth(0.35, 0.75, n + (rnd() - 0.5) * 0.3));
      c.lerp(c2, dirtAt(cx, cz));
      c.multiplyScalar(0.55 + 0.45 * smooth(0, 0.25, m));
      for (const v of tri) { pos.push(...v); col.push(c.r, c.g, c.b); }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const t = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true }));
  t.material.onBeforeCompile = patchFog;
  t.receiveShadow = true; scene.add(t); terrainMesh = t;
}

/* ================= grass ================= */
// shared wind (must match lily sway below)
const WIND_GLSL = `
  vec3 base = instanceMatrix[3].xyz;
  float g = 0.5 + 0.5 * sin(uTime * 1.8 - base.x * 2.2 + base.z * 0.7);
  float gust = 0.5 + 0.5 * sin(uTime * 0.55 - base.x * 0.9);
`;
function windJS(x, z, t) {
  const g = 0.5 + 0.5 * Math.sin(t * 1.8 - x * 2.2 + z * 0.7);
  const gust = 0.5 + 0.5 * Math.sin(t * 0.55 - x * 0.9);
  return g * gust;
}
{
  const p = [-0.5, 0, 0, 0.5, 0, 0, -0.4, 0.35, 0, 0.4, 0.35, 0, -0.22, 0.7, 0, 0.22, 0.7, 0, 0, 1, 0];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(Array(7).fill([0, 1, 0]).flat(), 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute([0.45, 0.45, 0.45, 0.45, 0.45, 0.45, 0.7, 0.7, 0.7, 0.7, 0.7, 0.7, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 1, 1, 1], 3));
  g.setIndex([0, 1, 3, 0, 3, 2, 2, 3, 5, 2, 5, 4, 4, 5, 6]);

  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = timeU;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <project_vertex>', `
      vec4 mvPosition = instanceMatrix * vec4(transformed, 1.0);
      { ${WIND_GLSL}
        float k = position.y * position.y;
        float amt = (0.012 + 0.06 * g * gust) * k;
        mvPosition.xz += vec2(${WIND.x.toFixed(3)}, ${WIND.z.toFixed(3)}) * amt;
        mvPosition.y -= amt * 0.35; }
      mvPosition = modelViewMatrix * mvPosition;
      gl_Position = projectionMatrix * mvPosition;`);
    // keep up-facing normal on both sides so back faces are not dark
    sh.fragmentShader = sh.fragmentShader.replace('#include <normal_fragment_begin>',
      'float faceDirection = 1.0; vec3 normal = normalize(vNormal); vec3 nonPerturbedNormal = normal;');
  };

  const pal = ['#2e3a22', '#43502a', '#5d6a31', '#6f6c36', '#8a7a45', '#a58f5c'].map(h => new THREE.Color(h));
  const COUNT = 26000;
  const im = new THREE.InstancedMesh(g, mat, COUNT);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(), v = new THREE.Vector3(), c = new THREE.Color();
  let n = 0, tries = 0;
  while (n < COUNT && tries++ < COUNT * 20) {
    const x = (rnd() * 2 - 1) * 1.7, z = (rnd() * 2 - 1) * 1.7;
    const m = mask(x, z), dirt = dirtAt(x, z);
    const rw = roughW(x, z);
    // beyond the torn edge: more stray straw bits flying off the bottom-right
    let p = m > 0 ? smooth(0, 0.3, m) * (1 - 0.88 * dirt) + 0.12 * rw * (1 - smooth(0, 0.15, m)) : (m > -0.12 - 0.12 * rw ? 0.06 + 0.14 * rw : 0);
    if (rnd() > p) continue;
    const h = (0.08 + 0.2 * rnd()) * (0.6 + 0.6 * fbm(x * 3, z * 3)) * (m > 0 ? 1 : 0.5) * (1 - 0.5 * dirt);
    const w = 0.012 + 0.012 * rnd();
    e.set((rnd() - 0.5) * 0.7, rnd() * Math.PI * 2, (rnd() - 0.5) * 0.7);
    q.setFromEuler(e);
    m4.compose(v.set(x, heightAt(x, z) - 0.005, z), q, s.set(w, h, w));
    im.setMatrixAt(n, m4);
    const f = fbm(x * 2.2 + 30, z * 2.2) * 0.75 + rnd() * 0.35 + dirt * 0.5;
    c.copy(pal[Math.min(pal.length - 1, Math.floor(f * pal.length))]).multiplyScalar(0.8 + 0.4 * rnd());
    if (m < 0.15) c.multiplyScalar(0.6 + 2.6 * Math.max(0, m));
    im.setColorAt(n, c);
    n++;
  }
  im.count = n;
  im.receiveShadow = true;
  scene.add(im);
  grassMesh = im;
  grassMaskMat = new THREE.MeshLambertMaterial({ color: 0x000000, side: THREE.DoubleSide });
  grassMaskMat.onBeforeCompile = mat.onBeforeCompile;
  grassGeo = g; grassMat = mat;
  { const base = mat.onBeforeCompile; mat.onBeforeCompile = sh => { base(sh); patchFog(sh); }; }
}

/* ================= canopy + trunks (off-screen forest, shadow-only) =================
   The whole field sits under a canopy; sunlight leaks through noise-shaped gaps

  const fog = scene.fog, tm = terrainMesh.material, gm = grassMesh.material;
  scene.fog = maskFog; terrainMesh.material = terrainMaskMat; grassMesh.material = grassMaskMat; motes.visible = false;
  for (const im of lilyMeshes) im.material = im.userData.maskMat;
  renderer.shadowMap.autoUpdate = false;
  renderer.setRenderTarget(maskRT); renderer.render(scene, cam);
  renderer.shadowMap.autoUpdate = true;
  scene.fog = fog; terrainMesh.material = tm; grassMesh.material = gm; motes.visible = true;
  for (const im of lilyMeshes) im.material = im.userData.mat;
}
ui.outline.onchange = e => { post.uniforms.uOutline.value = e.target.checked ? 1 : 0; };
ui.palette.onchange = e => { post.uniforms.uPalette.value = e.target.checked ? 1 : 0; };
ui.zoom.oninput = e => {
  const h = +e.target.value; ui.zoomv.textContent = h.toFixed(2);
  Object.assign(cam, { left: -h, right: h, top: h, bottom: -h }); cam.updateProjectionMatrix();
};
ui.clumps.oninput = e => { ui.clumpsv.textContent = e.target.value; if (lilyParts.length) rebuildLilies(); };
ui.hero.onchange = () => { if (lilyParts.length) rebuildLilies(); };
ui.fg.onchange = () => { if (lilyParts.length) rebuildLilies(); };
// resize foreground flowers in place (their base stays on the ground)
document.getElementById('fgroll').onclick = () => {
  fgSeed = (Math.random() * 4294967296) >>> 0;
  document.getElementById('fgseedv').textContent = 'fg ' + fgSeed;
  if (!ui.fg.checked) { ui.fg.checked = true; }
  if (lilyParts.length) rebuildLilies();
};
document.getElementById('fgs').oninput = e => { for (const l of lilies) if (l.fg) { l.s = l.s0 * +e.target.value; l.y = l.hy - fgRise(l.s, l.k); } };
document.getElementById('clip').onchange = e => { post.uniforms.uClip.value = e.target.checked ? 1 : 0; };
document.getElementById('reroll').onclick = () => {
  lilySeed = (Math.random() * 4294967296) >>> 0;
  document.getElementById('seedv').textContent = 'seed ' + lilySeed;
  if (lilyParts.length) rebuildLilies();
};
const postScene = new THREE.Scene();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post); quad.frustumCulled = false;
postScene.add(quad);
const postCam = new THREE.Camera();

document.getElementById('pix').onchange = e => {
  PIX = +e.target.value; LOW = Math.round(OUT / PIX);
  rt.setSize(LOW, LOW); maskRT.setSize(LOW, LOW); landRT.setSize(LOW, LOW); edgeRT.setSize(LOW, 1);
  post.uniforms.uLow.value = LOW; edgeMat.uniforms.uLow.value = LOW;
  post.uniforms.uRes.value = LOW / RES_REF; post.uniforms.uClipPad.value = 2 * LOW / RES_REF;
};
document.getElementById('dither').onchange = e => { post.uniforms.uDither.value = e.target.checked ? 0.55 : 0; };

/* ================= record ================= */
document.getElementById('rec').onclick = () => {
  const st = document.getElementById('st');
  // prefer MP4/H.264 (uploads to X, thumbnails in Explorer); fall back to WebM if the browser can't
  const type = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm']
    .find(t => MediaRecorder.isTypeSupported(t));
  const ext = type.startsWith('video/mp4') ? 'mp4' : 'webm';
  const mr = new MediaRecorder(renderer.domElement.captureStream(30), { mimeType: type, videoBitsPerSecond: 12e6 });
  const chunks = [];
  mr.ondataavailable = e => chunks.push(e.data);
  mr.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: type.split(';')[0] }));
    a.download = 'lycoris_field.' + ext; a.click(); st.textContent = '保存しました ' + ext.toUpperCase();
  };
  mr.start(); st.textContent = '録画中…';
  setTimeout(() => mr.stop(), 5000);
};

/* ================= loop ================= */
document.querySelectorAll('[data-fog]').forEach(el => el.oninput = () => {
  const k = el.dataset.fog, v = +el.value;
  fogU[k].value = v;
  if (k === 'uFarStart') fogU.uFarEnd.value = v + 1.4;
});
// ---- focus: click to focus, smooth focus pull ----
var focusTarget = cam.position.distanceTo(target); // start defocused (uFocus 11.2), then pull focus to the hero clump
const camDir = new THREE.Vector3(); cam.getWorldDirection(camDir);
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener('pointerdown', e => {
  const b = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - b.left) / b.width * 2 - 1, -((e.clientY - b.top) / b.height) * 2 + 1), cam);
  const hit = ray.intersectObjects([terrainMesh, ...lilyMeshes], false)[0];
  if (hit) focusTarget = hit.point.clone().sub(cam.position).dot(camDir);
});
document.querySelectorAll('[data-lit]').forEach(el => el.oninput = () => { litU[el.dataset.lit].value = +el.value; });
document.getElementById('shadef').oninput = e => buildCanopy(+e.target.value);
let dofOn = true;
document.getElementById('dof').onchange = e => { dofOn = e.target.checked; };
document.getElementById('dofs').oninput = e => { post.uniforms.uDof.value = +e.target.value; post.uniforms.uMaxR.value = Math.min(5, +e.target.value); };
document.getElementById('dofr').oninput = e => { post.uniforms.uFocusRange.value = +e.target.value; };
focusHero();

/* ================= time of day =================
   same sun azimuth (from screen top-left) for every preset; only height, colors and fill change. */
const TOD = {
  dawn:    { elev: 9,  sun: '#ffb39a', I: 2.6, sky: '#9fb2d8', gnd: '#2a2a35', hI: 0.55, fog: '#7d8aa3', lift: [0.13, 0.14, 0.2] },
  morning: { elev: 34, sun: '#fff0d6', I: 3.8, sky: '#a8c2dc', gnd: '#36401f', hI: 0.65, fog: '#6c8480', lift: [0.15, 0.18, 0.14] },
  noon:    { elev: 66, sun: '#fffaf0', I: 4.4, sky: '#b9d0e6', gnd: '#3d4426', hI: 0.75, fog: '#8a9a96', lift: [0.16, 0.18, 0.15] },
  golden:  { elev: null, sun: '#ffc488', I: 4.2, sky: '#7f94a8', gnd: '#2c2a1a', hI: 0.6, fog: '#5a6b66', lift: [0.15, 0.17, 0.12] },
  dusk:    { elev: 7,  sun: '#ff7444', I: 2.9, sky: '#4c5679', gnd: '#1d1a23', hI: 0.45, fog: '#4a4a63', lift: [0.12, 0.1, 0.18] },
  // night: the 'sun' is the moon — cool blue-white, weaker; deep blue fill and haze; no warm shift on lit petals
  night:   { elev: 28, sun: '#a9c2ff', I: 1.7, sky: '#22314f', gnd: '#0c0f16', hI: 0.4, fog: '#26324a', lift: [0.1, 0.13, 0.22], warm: 0 },
};
const SUN_AZ = new THREE.Vector2(-4.2, 1.6).normalize();
const GOLDEN_ELEV = Math.atan2(2.8, Math.hypot(4.2, 1.6)) * 180 / Math.PI;
function setTimeOfDay(key) {
  const t = TOD[key], e = (t.elev ?? GOLDEN_ELEV) * Math.PI / 180;
  sunDir.set(SUN_AZ.x * Math.cos(e), Math.sin(e), SUN_AZ.y * Math.cos(e));
  sun.position.copy(sun.target.position).addScaledVector(sunDir, SUN_DIST);
  sunH.set(sunDir.x, sunDir.z).normalize(); sunPerp.set(-sunH.y, sunH.x);
  cotElev = Math.hypot(sunDir.x, sunDir.z) / sunDir.y;
  sun.color.set(t.sun); sun.intensity = t.I;
  hemi.color.set(t.sky); hemi.groundColor.set(t.gnd); hemi.intensity = t.hI;
  scene.fog.color.set(t.fog);
  litU.uShadowLift.value.set(...t.lift);
  litU.uFlowerWarm.value = t.warm ?? 1;
  buildCanopy(+document.getElementById('shadef').value);
}
document.getElementById('tod').onchange = e => setTimeOfDay(e.target.value);
/* ================= settings: copy / import / 5 save slots ================= */
function getSettings() {
  return {
    v: 1, lilySeed, fgSeed, focus: +focusTarget.toFixed(4), tod: document.getElementById('tod').value,
    ui: Object.fromEntries([...document.querySelectorAll('#ui input, #ui select')].filter(el => !('nosave' in el.dataset))
      .map(el => [el.id || el.dataset.fog || el.dataset.lit, el.type === 'checkbox' ? el.checked : el.value])),
  };
}
function applySettings(set) {
  if (!set || typeof set.ui !== 'object') throw new Error('有効な設定ではありません');
  // seeds first, so every rebuild triggered below already uses them
  if (Number.isFinite(set.lilySeed)) lilySeed = set.lilySeed >>> 0;
  if (Number.isFinite(set.fgSeed)) fgSeed = set.fgSeed >>> 0;
  document.getElementById('seedv').textContent = 'seed ' + lilySeed;
  document.getElementById('fgseedv').textContent = 'fg ' + fgSeed;
  for (const [k, v] of Object.entries(set.ui)) {
    const el = document.getElementById(k) || document.querySelector(`[data-fog="${k}"],[data-lit="${k}"]`);
    if (!el || 'nosave' in el.dataset) continue;
    if (el.type === 'checkbox') { el.checked = !!v; el.dispatchEvent(new Event('change')); }
    else { el.value = v; el.dispatchEvent(new Event(el.tagName === 'SELECT' ? 'change' : 'input')); }
  }
  if (set.tod) { const t = document.getElementById('tod'); t.value = set.tod; t.dispatchEvent(new Event('change')); }
  if (lilyParts.length) rebuildLilies();
  if (Number.isFinite(set.focus)) { focusTarget = set.focus; post.uniforms.uFocus.value = set.focus; }
}
const SLOT_KEY = 'pixel-diorama-slots:' + location.pathname, SLOTS = 5;
const readSlots = () => { try { const a = JSON.parse(localStorage.getItem(SLOT_KEY)); return Array.isArray(a) ? a : []; } catch { return []; } };
const writeSlots = a => { try { localStorage.setItem(SLOT_KEY, JSON.stringify(a)); return true; } catch { return false; } };
const slotSel = document.getElementById('slot'), stEl = document.getElementById('st');
function renderSlots() {
  const a = readSlots(), cur = slotSel.value || '0';
  slotSel.innerHTML = '';
  for (let i = 0; i < SLOTS; i++) {
    const o = document.createElement('option'); o.value = i;
    o.textContent = `スロット ${i + 1} · ` + (a[i] ? new Date(a[i].time).toLocaleString('ja', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '空');
    slotSel.appendChild(o);
  }
  slotSel.value = cur;
}
renderSlots();
document.getElementById('slotsave').onclick = () => {
  const a = readSlots(), i = +slotSel.value;
  a[i] = { time: Date.now(), data: getSettings() };
  stEl.textContent = writeSlots(a) ? `スロット ${i + 1} に保存しました` : '保存できません（ブラウザのローカルストレージが無効です）';
  renderSlots();
};
document.getElementById('slotload').onclick = () => {
  const s = readSlots()[+slotSel.value];
  if (!s) { stEl.textContent = `スロット ${+slotSel.value + 1} は空です`; return; }
  try { applySettings(s.data); stEl.textContent = `スロット ${+slotSel.value + 1} を読み込みました`; } catch (e) { stEl.textContent = e.message; }
};
// dialog used for import and as copy fallback
const dlg = document.getElementById('dlg'), dlgText = document.getElementById('dlgtext'), dlgMsg = document.getElementById('dlgmsg');
function openDlg(title, text, importing) {
  document.getElementById('dlgtitle').textContent = title;
  dlgText.value = text; dlgMsg.textContent = '';
  document.getElementById('dlgok').hidden = !importing;
  dlg.hidden = false; dlgText.focus(); if (!importing) dlgText.select();
}
document.getElementById('dlgcancel').onclick = () => { dlg.hidden = true; };
document.getElementById('dlgok').onclick = () => {
  try { applySettings(JSON.parse(dlgText.value)); dlg.hidden = true; stEl.textContent = '設定を読み込みました'; }
  catch (e) { dlgMsg.textContent = '読み込み失敗：' + e.message; }
};
document.getElementById('importset').onclick = () => openDlg('設定を読み込む（貼り付けて「適用」）', '', true);
document.getElementById('copyset').onclick = async () => {
  const txt = JSON.stringify(getSettings());
  try { await navigator.clipboard.writeText(txt); stEl.textContent = '設定をコピーしました'; }
  catch { openDlg('この設定をコピー', txt, false); }
};
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  timeU.value = t;
  const fu = post.uniforms.uFocus; fu.value += (focusTarget - fu.value) * Math.min(1, dt * 2.5);
  post.uniforms.uDof.value = dofOn ? +document.getElementById('dofs').value : 0;
  updateLilies(t); updateMotes(dt, t);
  renderer.setRenderTarget(landRT); renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.render(landScene, cam); renderer.setClearColor(0x000000, 0);
  renderer.setRenderTarget(edgeRT); renderer.render(edgeScene, postCam);
  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  if (lilyMeshes.length && (post.uniforms.uOutline.value || post.uniforms.uPalette.value)) renderMask();
  else { renderer.setRenderTarget(maskRT); renderer.clear(); }
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
});
window.__ready = true;
</script></body></html>
