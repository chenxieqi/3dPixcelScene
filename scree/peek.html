<style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ================= config ================= */
const OUT = 960;                       // output canvas px (recorded video size)
const BG = new THREE.Color('#2a3033');  // flat background (dark, island edges dissolve into it)
const FOG = new THREE.Color('#9aa4a8'); // mountain mist
const R = 1.3;                          // island radius (m)
const WIND = new THREE.Vector3(0.93, 0, 0.36).normalize(); // blows toward screen right/down

/* ================= noise / rng ================= */
const hash = (x, y) => { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2; a *= 0.5; } return s / 0.9375; };
let seed = 20261121; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

/* ================= field functions =================
   Camera looks from +X+Y+Z, so screen bottom-right = +X, top-left = -X.  */
// edge roughness: bottom-right (+X) breaks up into notches, crumbs and stray clods like a torn edge
const roughW = (x, z) => smooth(0.05, 0.6, x / R + 0.15 * z / R);
const mask = (x, z) => {
  const base = 1 - Math.hypot(x, z) / R + (fbm(x * 1.8 + 5, z * 1.8 + 5) - 0.5) * 0.6;
  const w = roughW(x, z);
  if (w <= 0) return base;
  return base + w * ((fbm(x * 6 + 1, z * 6 + 3) - 0.5) * 0.42 + (vnoise(x * 18 + 7, z * 18 + 2) - 0.5) * 0.22);
};
const SLOPE = 0.34;   // a steep scree slope rising toward the top-left
const heightAt = (x, z) => -SLOPE * x + 0.1 * (fbm(x * 1.3 + 2, z * 1.3) - 0.5);
const dirtAt = (x, z) => 0;
let GREEN = 0.45;   // how much of the slope is covered by green cushions (slider)
const greenAt = (x, z) => smooth(0.62 - 0.3 * GREEN, 0.74 - 0.3 * GREEN, fbm(x * 2.3 + 4, z * 2.3 - 1) * 0.8 + vnoise(x * 7 + 3, z * 7) * 0.2 + 0.12 * x / R);
const centerW = (x, z) => Math.exp(-(x * x + z * z) / (2 * 0.5 * 0.5));

/* ================= renderer / scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1); renderer.setSize(OUT, OUT, false);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);
// panel toggle (remembered per browser)
{ const KEY = 'pixel-diorama-ui-hidden';
  try { const v = localStorage.getItem(KEY); if (v === '1' || (v === null && matchMedia('(pointer: coarse)').matches)) document.body.classList.add('ui-hidden'); } catch {}
  document.getElementById('uitoggle').onclick = () => {
    const h = document.body.classList.toggle('ui-hidden');
    try { localStorage.setItem(KEY, h ? '1' : '0'); } catch {}
  }; }

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(FOG, 9.85, 11.7);

/* ================= layered fog =================
   foreground darkened -> midground clear -> background hazy,
   plus a low ground mist that hides grass roots so blades separate in depth. */
const fogU = {
  uFar: { value: 0.65 },                               // background haze strength
  uMist: { value: 0.0 },                              // ground mist strength
  uMistH: { value: 0.2 },                             // ground mist height (m)
  uMistColor: { value: new THREE.Color('#4d5d58') },
  uFront: { value: 0.3 },                              // foreground darkening
  uFrontAt: { value: -0.2 },                           // where foreground darkening ends (scene depth, m)
  uFarStart: { value: -0.35 },                           // where background haze starts (0 = center)
  uFarEnd: { value: 1.05 },                             // where haze is full
  uFwd: { value: new THREE.Vector2(-1, -1).normalize() }, // camera forward on the ground plane
};
function patchFog(sh) {
  Object.assign(sh.uniforms, fogU);
  sh.vertexShader = sh.vertexShader
    .replace('#include <fog_pars_vertex>', '#include <fog_pars_vertex>\nvarying vec3 vWPos;')
    .replace('#include <fog_vertex>', '#include <fog_vertex>\nvWPos = (inverse(viewMatrix) * mvPosition).xyz;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <fog_pars_fragment>', `#include <fog_pars_fragment>
      varying vec3 vWPos;
      uniform float uFar, uMist, uMistH, uFront, uFrontAt, uFarStart, uFarEnd; uniform vec3 uMistColor; uniform vec2 uFwd;`)
    .replace('#include <fog_fragment>', `
      #ifdef USE_FOG
      {
        // scene depth = how far back along the ground, independent of height,
        // so a tall flower gets the same haze as the ground it stands on
        float sd = dot(vWPos.xz, uFwd);
        float dF = smoothstep(uFarStart, uFarEnd, sd);
        float hgt = vWPos.y - (-0.34 * vWPos.x);
        float mist = (1.0 - smoothstep(0.0, uMistH, hgt)) * uMist * (0.15 + 0.85 * dF);
        float front = (1.0 - smoothstep(uFrontAt - 1.1, uFrontAt, sd)) * uFront;
        gl_FragColor.rgb = mix(gl_FragColor.rgb, uMistColor, mist);
        gl_FragColor.rgb *= 1.0 - front;
        gl_FragColor.rgb = mix(gl_FragColor.rgb, fogColor, dF * uFar);
      }
      #endif`);
  patchLight(sh);
}
/* ================= shadow look =================
   shadows keep a green-yellow canopy light, objects bounce their own hue
   (green grass, red petals, yellow straw) into the shade, and the light/shadow
   boundary gets a darker band. */
const litU = {
  uShadowLift: { value: new THREE.Vector3(0.15, 0.17, 0.12) }, // fraction of sun left in shade (canopy-filtered)
  uLiftK: { value: 1.0 },
  uFlowerLit: { value: 1.3 },
  uFlowerWarm: { value: 1.0 },                                 // how much the boost shifts toward orange (0 at night)                                  // extra sunlight on flower heads (1 = none)
  uEdge: { value: 0.3 },
};
const SHADOW_LINE = 'directLight.color *= ( directLight.visible && receiveShadow ) ? getShadow( directionalShadowMap[ i ], directionalLightShadow.shadowMapSize, directionalLightShadow.shadowBias, directionalLightShadow.shadowRadius, vDirectionalShadowCoord[ i ] ) : 1.0;';
const LIGHTS_BEGIN = THREE.ShaderChunk.lights_fragment_begin.replace(SHADOW_LINE, `
    { float sh = ( directLight.visible && receiveShadow ) ? getShadow( directionalShadowMap[ i ], directionalLightShadow.shadowMapSize, directionalLightShadow.shadowBias, directionalLightShadow.shadowRadius, vDirectionalShadowCoord[ i ] ) : 1.0;
      gSun = directLight.color; gShadow = min(gShadow, sh);
      directLight.color *= mix(uShadowLift * uLiftK, vec3(1.0), sh); }`);
if (!THREE.ShaderChunk.lights_fragment_begin.includes(SHADOW_LINE)) console.warn('shadow chunk changed; shadow look disabled');
function patchLight(sh) {
  if (!sh.fragmentShader.includes('#include <lights_fragment_begin>')) return;
  Object.assign(sh.uniforms, litU);
  sh.fragmentShader = sh.fragmentShader
    .replace('void main() {', 'uniform vec3 uShadowLift; uniform float uLiftK, uEdge, uFlowerLit, uFlowerWarm;\nvoid main() {\n  float gShadow = 1.0; vec3 gSun = vec3(0.0);')
    .replace('#include <lights_fragment_begin>', LIGHTS_BEGIN)
    .replace('#include <aomap_fragment>', `
      {
        #ifdef IS_FLOWER
        // only the sunlit part is boosted, warming toward orange as it gets brighter
        reflectedLight.directDiffuse *= uFlowerLit * vec3(1.0, 1.0 + 0.35 * uFlowerWarm * (uFlowerLit - 1.0), 1.0 + 0.1 * uFlowerWarm * (uFlowerLit - 1.0));
        #endif
        float dk = 1.0 - uEdge * 4.0 * gShadow * (1.0 - gShadow);
        reflectedLight.directDiffuse *= dk; reflectedLight.indirectDiffuse *= dk;
      }
      #include <aomap_fragment>`);
}


const H = 1.65;
const cam = new THREE.OrthographicCamera(-H, H, H, -H, 0.1, 30);
const target = new THREE.Vector3(0, 0.12, 0);
cam.position.copy(target).add(new THREE.Vector3(1, 1.15, 1).normalize().multiplyScalar(10));
cam.lookAt(target);

const hemi = new THREE.HemisphereLight(0x7f94a8, 0x2c2a1a, 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffc488, 4.2);
const SUN_DIST = 20;
sun.position.set(-4.2, 2.8, 1.6).normalize().multiplyScalar(SUN_DIST);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 6;
Object.assign(sun.shadow.camera, { left: -3.2, right: 3.2, top: 3.2, bottom: -3.2, near: 1, far: 45 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.01;
scene.add(sun, sun.target);

const timeU = { value: 0 };
let terrainMesh, grassMesh, grassMaskMat, grassGeo, grassMat;

/* ================= terrain ================= */
function buildTerrain() {
  if (terrainMesh) { scene.remove(terrainMesh); terrainMesh.geometry.dispose(); }
  let seed = 20261121; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const N = 170, S = 1.7, pos = [], col = [];
  const cGround = new THREE.Color('#55595b'), cGround2 = new THREE.Color('#7b7e7f');
  const cDirt = new THREE.Color('#36502a'), cDirt2 = new THREE.Color('#57703a');
  const P = (i, j) => { const x = -S + 2 * S * i / N, z = -S + 2 * S * j / N; return [x, heightAt(x, z), z]; };
  const c = new THREE.Color(), c2 = new THREE.Color();
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const a = P(i, j), b = P(i + 1, j), cc = P(i + 1, j + 1), d = P(i, j + 1);
    for (const tri of [[a, cc, b], [a, d, cc]]) {
      const cx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3, cz = (tri[0][2] + tri[1][2] + tri[2][2]) / 3;
      const m = mask(cx, cz); if (m <= 0) continue;
      const n = fbm(cx * 6, cz * 6);
      c.copy(cGround).lerp(cGround2, smooth(0.2, 0.8, n * 0.5 + rnd() * 0.5));      // gravel speckle
      c2.copy(cDirt).lerp(cDirt2, smooth(0.35, 0.75, n + (rnd() - 0.5) * 0.3));
      c.lerp(c2, greenAt(cx, cz) * 0.9);
      c.multiplyScalar(0.55 + 0.45 * smooth(0, 0.25, m));
      for (const v of tri) { pos.push(...v); col.push(c.r, c.g, c.b); }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const t = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true }));
  t.material.onBeforeCompile = patchFog;
  t.receiveShadow = true; scene.add(t); terrainMesh = t;
}
buildTerrain();

/* ================= grass ================= */
const GRASS_PAL = ['#2f4426', '#3f5a2c', '#527034', '#66813d', '#7d8b52', '#8f9668'].map(h => new THREE.Color(h));
// shared wind (must match lily sway below)
const WIND_GLSL = `
  vec3 base = instanceMatrix[3].xyz;
  float g = 0.5 + 0.5 * sin(uTime * 1.8 - base.x * 2.2 + base.z * 0.7);
  float gust = 0.5 + 0.5 * sin(uTime * 0.55 - base.x * 0.9);
`;
function windJS(x, z, t) {
  const g = 0.5 + 0.5 * Math.sin(t * 1.8 - x * 2.2 + z * 0.7);
  const gust = 0.5 + 0.5 * Math.sin(t * 0.55 - x * 0.9);
  return g * gust;
}
{
  const p = [-0.5, 0, 0, 0.5, 0, 0, -0.4, 0.35, 0, 0.4, 0.35, 0, -0.22, 0.7, 0, 0.22, 0.7, 0, 0, 1, 0];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(Array(7).fill([0, 1, 0]).flat(), 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute([0.45, 0.45, 0.45, 0.45, 0.45, 0.45, 0.7, 0.7, 0.7, 0.7, 0.7, 0.7, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 1, 1, 1], 3));
  g.setIndex([0, 1, 3, 0, 3, 2, 2, 3, 5, 2, 5, 4, 4, 5, 6]);

  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = timeU;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <project_vertex>', `
      vec4 mvPosition = instanceMatrix * vec4(transformed, 1.0);
      { ${WIND_GLSL}
        float k = position.y * position.y;
        float amt = (0.012 + 0.06 * g * gust) * k;
        mvPosition.xz += vec2(${WIND.x.toFixed(3)}, ${WIND.z.toFixed(3)}) * amt;
        mvPosition.y -= amt * 0.35; }
      mvPosition = modelViewMatrix * mvPosition;
      gl_Position = projectionMatrix * mvPosition;`);

const STEM_TOP = 0.42, _mStem = new THREE.Matrix4(), _off = new THREE.Vector3();
const swayAxis = new THREE.Vector3(0, 1, 0).cross(WIND).normalize();
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _qy = new THREE.Quaternion(), _ql = new THREE.Quaternion(),
  _qw = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), UPV = new THREE.Vector3(0, 1, 0);
function updateLilies(t) {
  if (!lilyMeshes.length) return;
  lilies.forEach((l, i) => {
    const w = windJS(l.x, l.z, t);
    const ang = 0.015 + 0.07 * w + 0.01 * Math.sin(t * 2.3 + l.ph);
    _qw.setFromAxisAngle(swayAxis, ang);
    _ql.setFromEuler(_e.set(l.leanX, 0, l.leanZ));
    _qy.setFromAxisAngle(UPV, l.yaw);
    _q.copy(_qw).multiply(_ql).multiply(_qy);
    // stem stretched by k, flower head lifted to the new stem top
    _mStem.compose(_p.set(l.x, l.y, l.z), _q, _s.set(l.s, l.s * l.k, l.s));
    _off.set(0, STEM_TOP * l.s * (l.k - 1), 0).applyQuaternion(_q);
    _m.compose(_p.add(_off), _q, _s.setScalar(l.s));
    for (const im of lilyMeshes) im.setMatrixAt(i, im.userData.isStem ? _mStem : _m);
  });
  for (const im of lilyMeshes) im.instanceMatrix.needsUpdate = true;
}

const MOTES = 40, motePos = new Float32Array(MOTES * 3), moteSeed = [];
for (let i = 0; i < MOTES; i++) {
  const a = rnd() * 6.283, r = Math.sqrt(rnd()) * R * 1.1;
  motePos.set([Math.cos(a) * r, 0.2 + rnd() * 1.0, Math.sin(a) * r], i * 3);
  moteSeed.push(rnd() * 6.283);
}
const moteGeo = new THREE.BufferGeometry();
moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
const motes = new THREE.Points(moteGeo, new THREE.PointsMaterial({ color: 0xc9d0d2, size: 1, sizeAttenuation: false }));
motes.material.onBeforeCompile = patchFog;
scene.add(motes);
function updateMotes(dt, t) {
  for (let i = 0; i < MOTES; i++) {
    const k = i * 3;
    motePos[k] += (WIND.x * 0.05 + 0.02 * Math.sin(t + moteSeed[i])) * dt;
    motePos[k + 2] += (WIND.z * 0.05 + 0.02 * Math.cos(t * 0.7 + moteSeed[i])) * dt;
    motePos[k + 1] += (0.03 + 0.02 * Math.sin(t * 1.3 + moteSeed[i])) * dt;
    if (motePos[k + 1] > 1.3 || Math.hypot(motePos[k], motePos[k + 2]) > R * 1.3) {
      const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * R;
      motePos[k] = Math.cos(a) * r; motePos[k + 2] = Math.sin(a) * r; motePos[k + 1] = 0.15;
    }
  }
  moteGeo.attributes.position.needsUpdate = true;
}

/* ================= window ("parallax peek") camera =================
   The canvas is a window: a rectangle S ± R*W ± U*W in the world, facing the viewer.
   The eye E (from face tracking, in cm relative to the canvas center) looks through it with an
   off-axis frustum (Kooima's generalized perspective projection), so the scene behind the window
   shifts correctly as the head moves. */
const pcam = new THREE.PerspectiveCamera();
const P = {
  W: H,                                   // half-size of the window in world units (= the ortho frame)
  back: 1.55,                             // the window sits this far in front of the scene center
  eyeCm: new THREE.Vector3(0, 0, 40),     // eye position, cm, relative to the canvas center (x right, y up, z out)
  eyeTarget: new THREE.Vector3(0, 0, 40),
};
const coarse = matchMedia('(pointer: coarse)').matches;
if (!coarse) { document.getElementById('scrw').value = 26; document.getElementById('camoff').value = 15; P.eyeCm.z = P.eyeTarget.z = 60; }
document.getElementById('scrwv').textContent = document.getElementById('scrw').value;
document.getElementById('camoffv').textContent = document.getElementById('camoff').value;
const _R = new THREE.Vector3(), _U = new THREE.Vector3(), _N = new THREE.Vector3(), _S = new THREE.Vector3(), _E = new THREE.Vector3(), _B = new THREE.Matrix4();
function windowBasis() {
  cam.updateMatrixWorld();
  _R.setFromMatrixColumn(cam.matrixWorld, 0).normalize();
  _U.setFromMatrixColumn(cam.matrixWorld, 1).normalize();
  _N.setFromMatrixColumn(cam.matrixWorld, 2).normalize();      // toward the viewer
  _S.copy(target).addScaledVector(_N, P.back);
}
function updatePeekCam() {
  windowBasis();
  P.W = cam.top;                                                 // follows the zoom slider
  const k = 2 * P.W / +document.getElementById('scrw').value;    // world units per cm
  const s = +document.getElementById('peekk').value;
  P.eyeCm.lerp(P.eyeTarget, 0.35);
  _E.copy(_S).addScaledVector(_R, P.eyeCm.x * k * s).addScaledVector(_U, P.eyeCm.y * k * s).addScaledVector(_N, Math.max(5, P.eyeCm.z) * k);
  const n = 0.1, f = _E.distanceTo(_S) + 30;
  const va = _S.clone().addScaledVector(_R, -P.W).addScaledVector(_U, -P.W).sub(_E);
  const vb = _S.clone().addScaledVector(_R, P.W).addScaledVector(_U, -P.W).sub(_E);
  const vc = _S.clone().addScaledVector(_R, -P.W).addScaledVector(_U, P.W).sub(_E);
  const d = -va.dot(_N);
  const l = _R.dot(va) * n / d, r = _R.dot(vb) * n / d, b = _U.dot(va) * n / d, t = _U.dot(vc) * n / d;
  pcam.position.copy(_E);
  pcam.quaternion.setFromRotationMatrix(_B.makeBasis(_R, _U, _N));
  pcam.near = n; pcam.far = f;
  pcam.updateMatrixWorld(true);
  pcam.projectionMatrix.makePerspective(l, r, t, b, n, f);
  pcam.projectionMatrixInverse.copy(pcam.projectionMatrix).invert();
  post.uniforms.uNear.value = n; post.uniforms.uFar.value = f;
  // keep the focus on the main poppy from wherever the eye is
  const hero = (genLilies.centers || []).find(c => c.tier === 'L');
  if (hero) { const hv = new THREE.Vector3(hero.x, heightAt(hero.x, hero.z) + HEAD_H * hero.s, hero.z); focusTarget = hv.sub(_E).dot(_N.clone().negate()); }
  updateBox();
}

/* ---- the box behind the window: dim walls with a faint grid, so the depth reads ---- */
const gridTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#1c2225'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#2b3438'; g.fillRect(0, 0, 64, 2); g.fillRect(0, 0, 2, 64);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const boxMat = new THREE.MeshBasicMaterial({ map: gridTex, side: THREE.BackSide, fog: false });
const box = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), [boxMat, boxMat, boxMat, boxMat, boxMat, new THREE.MeshBasicMaterial({ visible: false })]);
scene.add(box);
function updateBox() {
  const D = +document.getElementById('boxd').value;
  box.visible = document.getElementById('box').checked && D > 0.05;
  if (!box.visible) return;
  // box from the window plane back by D (+ the scene depth), sized to the window
  const depth = P.back + D;
  box.position.copy(_S).addScaledVector(_N, -depth / 2);
  box.quaternion.setFromRotationMatrix(_B.makeBasis(_R, _U, _N));
  box.scale.set(2 * P.W, 2 * P.W, depth);
  for (const m of [boxMat]) { m.map.repeat.set(8, 8); }
}

/* ---- eye position: drag to simulate, or the front camera ---- */
let tracking = false, dragging = false;
renderer.domElement.addEventListener('pointerdown', e => { if (!tracking) { dragging = true; dragEye(e); } });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', e => { if (dragging && !tracking) dragEye(e); });
function dragEye(e) {
  const b = renderer.domElement.getBoundingClientRect();
  const nx = (e.clientX - b.left) / b.width * 2 - 1, ny = -((e.clientY - b.top) / b.height * 2 - 1);
  const w = +document.getElementById('scrw').value;
  P.eyeTarget.set(-nx * w * 0.9, -ny * w * 0.9, P.eyeTarget.z);   // drag right = look in from the left
}
const trkSt = document.getElementById('trkst');
document.getElementById('trk').onclick = async () => {
  if (tracking) return;
  trkSt.textContent = '顔認識を読み込み中…';
  try {
    const { FaceLandmarker, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const mk = delegate => FaceLandmarker.createFromOptions(fs, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate },
      runningMode: 'VIDEO', numFaces: 1 });
    let fl;
    try { fl = await mk('GPU'); } catch (e) { fl = await mk('CPU'); }   // some phones / WebViews have no GPU delegate
    trkSt.textContent = 'カメラを要求中…';
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    const video = document.createElement('video'); video.playsInline = true; video.muted = true; video.srcObject = stream;
    await video.play();
    tracking = true; trkSt.textContent = 'トラッキング中';
    let last = -1, lost = 0;
    const loop = () => {
      if (video.readyState >= 2 && video.currentTime !== last) {
        last = video.currentTime;
        const res = fl.detectForVideo(video, performance.now());
        const lm = res.faceLandmarks && res.faceLandmarks[0];
        if (lm) {
          lost = 0;
          const a = lm[468] || lm[33], b = lm[473] || lm[263];                 // iris centers (fallback: eye corners)
          const vw = video.videoWidth, vh = video.videoHeight;
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          const ipd = Math.hypot((a.x - b.x) * vw, (a.y - b.y) * vh) / vw;     // eye distance as a fraction of image width
          const th = Math.tan(+document.getElementById('hfov').value * Math.PI / 360);
          const z = 6.3 / (2 * th * Math.max(ipd, 1e-3));                       // cm, from the average eye distance
          const sgn = document.getElementById('mirror').checked ? -1 : 1;
          const x = sgn * (0.5 - mx) * 2 * th * z;
          const y = (0.5 - my) * 2 * th * (vh / vw) * z + +document.getElementById('camoff').value;
          P.eyeTarget.set(x, y, z);
          trkSt.textContent = `トラッキング中 · 目 ${x.toFixed(0)}, ${y.toFixed(0)}, 距離 ${z.toFixed(0)} cm`;
        } else if (++lost > 15) { trkSt.textContent = '顔が見つかりません（インカメラに顔を映してください）'; P.eyeTarget.set(0, 0, P.eyeTarget.z); }
      }
      requestAnimationFrame(loop);
    };
    loop();
  } catch (err) {
    trkSt.textContent = '開始できません：' + (err && err.message || err) + (isSecureContext ? '' : '（カメラには https か localhost が必要です）');
  }
};
if (new URLSearchParams(location.search).has('autotrack')) setTimeout(() => document.getElementById('trk').click(), 300);
for (const id of ['scrw', 'camoff', 'hfov']) document.getElementById(id).addEventListener('input', e => {
  document.getElementById(id + 'v').textContent = e.target.value + (id === 'hfov' ? '°' : '');
});

/* ================= settings: copy / import / 5 save slots ================= */
function getSettings() {
  return {
    v: 1, scene: 'scree', lilySeed, fgSeed, rockSeed, focus: +focusTarget.toFixed(4), tod: document.getElementById('tod').value,
    ui: Object.fromEntries([...document.querySelectorAll('#ui input, #ui select')].filter(el => !('nosave' in el.dataset))
      .map(el => [el.id || el.dataset.fog || el.dataset.lit, el.type === 'checkbox' ? el.checked : el.value])),
  };
}
function applySettings(set) {
  if (!set || typeof set.ui !== 'object') throw new Error('有効な設定ではありません');
  // seeds first, so every rebuild triggered below already uses them
  if (Number.isFinite(set.lilySeed)) lilySeed = set.lilySeed >>> 0;
  if (Number.isFinite(set.fgSeed)) fgSeed = set.fgSeed >>> 0;
  if (Number.isFinite(set.rockSeed)) rockSeed = set.rockSeed >>> 0;
  document.getElementById('rockseedv').textContent = 'rock ' + rockSeed;
  document.getElementById('seedv').textContent = 'seed ' + lilySeed;
  document.getElementById('fgseedv').textContent = 'fg ' + fgSeed;
  for (const [k, v] of Object.entries(set.ui)) {
    const el = document.getElementById(k) || document.querySelector(`[data-fog="${k}"],[data-lit="${k}"]`);
    if (!el || 'nosave' in el.dataset) continue;
    if (el.type === 'checkbox') { el.checked = !!v; el.dispatchEvent(new Event('change')); }
    else { el.value = v; el.dispatchEvent(new Event(el.tagName === 'SELECT' ? 'change' : 'input')); }
  }
  if (set.tod) { const t = document.getElementById('tod'); t.value = set.tod; t.dispatchEvent(new Event('change')); }
  if (lilyParts.length) rebuildLilies();
  if (Number.isFinite(set.focus)) { focusTarget = set.focus; post.uniforms.uFocus.value = set.focus; }
}
const SLOT_KEY = 'pixel-diorama-slots:' + location.pathname, SLOTS = 5;
const readSlots = () => { try { const a = JSON.parse(localStorage.getItem(SLOT_KEY)); return Array.isArray(a) ? a : []; } catch { return []; } };
const writeSlots = a => { try { localStorage.setItem(SLOT_KEY, JSON.stringify(a)); return true; } catch { return false; } };
const slotSel = document.getElementById('slot'), stEl = document.getElementById('st');
function renderSlots() {
  const a = readSlots(), cur = slotSel.value || '0';
  slotSel.innerHTML = '';
  for (let i = 0; i < SLOTS; i++) {
    const o = document.createElement('option'); o.value = i;
    o.textContent = `スロット ${i + 1} · ` + (a[i] ? new Date(a[i].time).toLocaleString('ja', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '空');
    slotSel.appendChild(o);
  }
  slotSel.value = cur;
}
renderSlots();
document.getElementById('slotsave').onclick = () => {
  const a = readSlots(), i = +slotSel.value;
  a[i] = { time: Date.now(), data: getSettings() };
  stEl.textContent = writeSlots(a) ? `スロット ${i + 1} に保存しました` : '保存できません（ブラウザのローカルストレージが無効です）';
  renderSlots();
};
document.getElementById('slotload').onclick = () => {
  const s = readSlots()[+slotSel.value];
  if (!s) { stEl.textContent = `スロット ${+slotSel.value + 1} は空です`; return; }
  try { applySettings(s.data); stEl.textContent = `スロット ${+slotSel.value + 1} を読み込みました`; } catch (e) { stEl.textContent = e.message; }
};
// dialog used for import and as copy fallback
const dlg = document.getElementById('dlg'), dlgText = document.getElementById('dlgtext'), dlgMsg = document.getElementById('dlgmsg');
function openDlg(title, text, importing) {
  document.getElementById('dlgtitle').textContent = title;
  dlgText.value = text; dlgMsg.textContent = '';
  document.getElementById('dlgok').hidden = !importing;
  dlg.hidden = false; dlgText.focus(); if (!importing) dlgText.select();
}
document.getElementById('dlgcancel').onclick = () => { dlg.hidden = true; };
document.getElementById('dlgok').onclick = () => {
  try { applySettings(JSON.parse(dlgText.value)); dlg.hidden = true; stEl.textContent = '設定を読み込みました'; }
  catch (e) { dlgMsg.textContent = '読み込み失敗：' + e.message; }
};
document.getElementById('importset').onclick = () => openDlg('設定を読み込む（貼り付けて「適用」）', '', true);
document.getElementById('copyset').onclick = async () => {
  const txt = JSON.stringify(getSettings());
  try { await navigator.clipboard.writeText(txt); stEl.textContent = '設定をコピーしました'; }
  catch { openDlg('この設定をコピー', txt, false); }
};
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  timeU.value = t;
  const fu = post.uniforms.uFocus; fu.value += (focusTarget - fu.value) * Math.min(1, dt * 2.5);
  post.uniforms.uDof.value = dofOn ? +document.getElementById('dofs').value : 0;
  updateLilies(t); updateMotes(dt, t);
  renderer.setRenderTarget(landRT); renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.render(landScene, cam); renderer.setClearColor(0x000000, 0);
  renderer.setRenderTarget(edgeRT); renderer.render(edgeScene, postCam);
  updatePeekCam();
  renderer.setRenderTarget(rt); renderer.render(scene, pcam);
  if (lilyMeshes.length && (post.uniforms.uOutline.value || post.uniforms.uPalette.value)) renderMask();
  else { renderer.setRenderTarget(maskRT); renderer.clear(); }
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
});
buildRocks(); buildSmallFlowers();
window.__ready = true;
</script></body></html>
